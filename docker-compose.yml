# Markport behind your own reverse proxy.
#
#   cp .env.example .env    # optional - every setting has a default
#   docker compose up -d --build
#
# Set MARKPORT_PASSWORD (in .env) to give the app its own login; share links
# work without it. Without it the app has no login and the proxy must
# authenticate. It is published on 127.0.0.1 only, for a reverse proxy on the
# same host to add HTTPS. See src/deployments/server/README.md.

services:
  markport:
    build:
      context: .
      args:
        OBSIDIAN_VERSION: ${OBSIDIAN_VERSION:-1.12.7}
        INSTALL_CLAUDE_CODE: ${MARKPORT_NODE_BRIDGE:-false}
        INSTALL_IMAGEMAGICK: ${MARKPORT_IMAGEMAGICK:-true}
    image: markport:local
    # Local-only image: never pull it from a registry, always build it here.
    # Without this, Portainer's "Re-pull image" tries Docker Hub and fails.
    pull_policy: build
    container_name: markport
    restart: unless-stopped
    ports:
      - "${MARKPORT_BIND:-127.0.0.1}:${MARKPORT_PORT:-3500}:3500"
    environment:
      # Owner login. Empty = no login (then the proxy must authenticate).
      MARKPORT_PASSWORD: ${MARKPORT_PASSWORD:-}
      DEFAULT_VAULT_NAME: ${DEFAULT_VAULT_NAME:-Notes}
      VAULT_PATH: /data/vaults/${DEFAULT_VAULT_NAME:-Notes}
      WATCH_POLLING: ${WATCH_POLLING:-false}
      # Real Node APIs for desktop-only plugins (Claudian). Lets anyone who
      # can open the site run commands in this container - only with an
      # authenticating reverse proxy in front. See the server README.
      MARKPORT_NODE_BRIDGE: ${MARKPORT_NODE_BRIDGE:-false}
      # Image library cache (thumbnails, previews, web-optimized 3D models),
      # in /data/media-cache - never inside a vault. Size cap in MB.
      MARKPORT_MEDIA_CACHE_MB: ${MARKPORT_MEDIA_CACHE_MB:-5120}
      # MCP endpoint for apps like Claude, at /mcp, signed in with OAuth.
      # See "Connecting Claude" in the server README.
      MARKPORT_MCP: ${MARKPORT_MCP:-true}
      MARKPORT_PUBLIC_URL: ${MARKPORT_PUBLIC_URL:-}
      MARKPORT_OAUTH_REDIRECT_HOSTS: ${MARKPORT_OAUTH_REDIRECT_HOSTS:-claude.ai,claude.com}
      MARKPORT_OAUTH_CLIENT_HOSTS: ${MARKPORT_OAUTH_CLIENT_HOSTS:-claude.ai,claude.com,anthropic.com}
      MARKPORT_MCP_PLAIN_PUNCTUATION: ${MARKPORT_MCP_PLAIN_PUNCTUATION:-false}
      MARKPORT_MCP_INSTRUCTIONS_FILE: ${MARKPORT_MCP_INSTRUCTIONS_FILE:-}
    volumes:
      - ${MARKPORT_DATA:-markport-data}:/data
    # If your proxy runs as a container on a shared Docker network instead of
    # on the host, uncomment this, drop the `ports:` block above, and point the
    # proxy at http://markport:3500.
    # networks: [proxy]

volumes:
  markport-data:

